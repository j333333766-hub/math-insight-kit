<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>폴리패드로 테셀레이션 깔기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* 교실용: 왼쪽 미션(순서쌍) + 오른쪽 폴리패드(공식 JS API). 미션별 그림판은 이 기기에 저장, [그림으로 저장]으로 PNG 내려받기 */
  :root { --red:#e84118; --sky:#17b5e2; --yellow:#ffc900; --ink:#1d2433; --muted:#6b7385; --line:#e3e7ee; --bg:#f6f8fb; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:'Noto Sans KR',sans-serif; color:var(--ink); background:var(--bg); display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:#fff; border-bottom:4px solid; border-image:linear-gradient(90deg,var(--red) 0 33%,var(--sky) 33% 66%,var(--yellow) 66%) 1; }
  header h1 { font-size:19px; margin:0; font-weight:800; }
  header .tag { font-size:12px; font-weight:700; color:var(--red); background:#fdeee9; padding:3px 9px; border-radius:99px; }
  header .sp { flex:1; }
  header a.btn { font-size:13px; }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:9px; border:1px solid var(--line); background:#fff; color:var(--ink); text-decoration:none; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn:hover { border-color:var(--sky); }
  .wrap { flex:1; display:grid; grid-template-columns: minmax(300px, 32%) 1fr; min-height:0; }
  aside { background:#fff; border-right:1px solid var(--line); overflow-y:auto; padding:16px 18px 24px; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; }
  .tabs button { flex:1; padding:8px 2px; white-space:nowrap; font-size:13px !important; border:1px solid var(--line); border-radius:10px; background:#fff; font:700 14px 'Noto Sans KR',sans-serif; color:var(--muted); cursor:pointer; }
  .tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .mission { display:none; }
  .mission.on { display:block; }
  .mission h2 { font-size:20px; margin:4px 0 6px; }
  .mission .goal { font-size:15px; line-height:1.6; margin:0 0 12px; }
  .box { border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:10px 0; background:#fbfcfe; }
  .box h3 { font-size:14px; margin:0 0 6px; color:var(--muted); }
  .box ol, .box ul { margin:0; padding-left:20px; line-height:1.7; font-size:15px; }
  .q { border-left:4px solid var(--yellow); background:#fffbea; }
  .q h3 { color:#8a6a00; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .chip { font-size:14px; font-weight:700; padding:4px 10px; border-radius:99px; background:#eef6fb; color:#0f6f8f; border:1px solid #cfe7f2; }
  .chip.no { background:#fde8e7; color:#b4231b; border-color:#f3b1ac; }
  details { margin-top:8px; font-size:14px; }
  details summary { cursor:pointer; font-weight:700; color:var(--sky); }
  details p { margin:6px 0 0; line-height:1.6; }
  .tip { font-size:13px; color:var(--muted); line-height:1.6; margin-top:14px; }
  main { position:relative; min-height:0; }
  main iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; }
  .nokey { position:absolute; left:16px; right:72px; top:12px; z-index:2; font-size:13px; background:#fff7d6; color:#7a5a00; border:1px solid #f0d77a; border-radius:10px; padding:8px 12px; }
  .sync { font-size:13px; font-weight:600; padding:6px 16px; background:#fff7d6; color:#7a5a00; border-bottom:1px solid #f0d77a; }
  #pp { position:absolute; inset:0; }
  button.chip { cursor:pointer; font-family:inherit; }
  button.chip.pick:hover { border-color:var(--sky); }
  button.chip.sel { background:var(--ink); color:#fff; border-color:var(--ink); }
  .lvl { font-size:12px; font-weight:700; color:var(--muted); margin:8px 0 2px; }
  .pair { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .pair .pl { font-size:12px; font-weight:700; color:var(--muted); width:34px; }
  .pair .vs { font-size:12px; color:var(--muted); }
  .muted2 { font-size:12px; color:var(--muted); }
  .mine { position:sticky; bottom:0; margin-top:14px; border:2px solid var(--sky); border-radius:12px; padding:10px 12px; background:#f3fbfe; }
  .mine-h { font-size:14px; }
  .mine-c { font-weight:800; }
  .mine-btns { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .mine-btns .btn { font-size:13px; padding:6px 10px; }
  .add-btns { display:contents; }
  .mine-btns .btn:disabled { opacity:.45; cursor:default; }
  .mine-r { font-size:13px; color:var(--muted); margin-top:8px; line-height:1.6; }
  .mine-r b { color:var(--ink); }
  .subbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:-4px 0 12px; padding:8px 10px; border-radius:12px; background:#f6f8fb; border:1px solid var(--line); }
  .sub-go { background:var(--red); color:#fff; border-color:var(--red); font-weight:800; }
  .sub-go:hover { border-color:var(--red); filter:brightness(1.05); }
  .sub-go:disabled { opacity:.45; cursor:default; filter:none; }
  .sub-st { font-size:13px; color:var(--muted); }
  .sub-st.ok { color:#1c7a47; font-weight:700; }
  .sub-st.err { color:#b4231b; font-weight:700; }
  .tabs button .ck { margin-left:4px; color:#2bb673; }
  .tabs button.on .ck { color:#7ff0b4; }
  @media (max-width: 820px) { .wrap { grid-template-columns:1fr; grid-template-rows:auto 70vh; } aside { border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<script>/* 11/12 연수 사이트 안에 끼워 보일 때는 제목줄을 숨겨 폴리패드를 크게 */ if (window.top !== window.self) document.documentElement.classList.add('in-frame');</script>
<style>.in-frame header { display: none !important; } .in-frame .sync { padding-top: 4px; padding-bottom: 4px; font-size: 12.5px; }</style>

  <span class="tag">테셀레이션</span>

<div id="sync-bar" class="sync">폴리패드를 불러오는 중…</div>
<div class="wrap">
  <aside>
    <div class="tabs" role="tablist">
      <button class="on" data-m="1" title="한 꼭짓점에 정다각형 3개">미션 1 · 3개</button>

    <div class="subbar">
      <button type="button" class="btn sub-go" id="b-submit" disabled>🖼 미션 1 그림으로 저장</button>
      <span class="sub-st" id="sub-st">타일을 놓은 뒤 저장해요</span>

    <!-- 11/12 사용자: 미션 = 한 꼭짓점에 모인 정다각형의 개수(3·4·5·6개), 설명 글 없이 조합 순서쌍만 -->

      <div class="chips"><button class="chip pick" data-c="6.6.6">(6, 6, 6)</button><button class="chip pick" data-c="4.8.8">(4, 8, 8)</button><button class="chip pick" data-c="3.12.12">(3, 12, 12)</button><button class="chip pick" data-c="4.6.12">(4, 6, 12)</button><button class="chip pick" data-c="5.5.10">(5, 5, 10)</button></div>
    </section>

      <h2>한 꼭짓점에 정다각형 4개</h2>
      <div class="chips"><button class="chip pick" data-c="4.4.4.4">(4, 4, 4, 4)</button><button class="chip pick" data-c="3.6.3.6">(3, 6, 3, 6)</button><button class="chip pick" data-c="3.4.6.4">(3, 4, 6, 4)</button><button class="chip pick" data-c="3.3.6.6">(3, 3, 6, 6)</button><button class="chip pick" data-c="3.4.4.6">(3, 4, 4, 6)</button></div>
    </section>
    <section class="mission" id="m3">

      <div class="chips"><button class="chip pick" data-c="3.3.3.4.4">(3, 3, 3, 4, 4)</button><button class="chip pick" data-c="3.3.4.3.4">(3, 3, 4, 3, 4)</button><button class="chip pick" data-c="3.3.3.3.6">(3, 3, 3, 3, 6)</button></div>
    </section>
    <section class="mission" id="m4">
      <h2>한 꼭짓점에 정다각형 6개</h2>
      <div class="chips"><button class="chip pick" data-c="3.3.3.3.3.3">(3, 3, 3, 3, 3, 3)</button></div>
    </section>

    <div class="mine" id="mine">
      <div class="mine-h"><b>내 조합</b> <span id="mine-c" class="mine-c">위 순서쌍을 눌러 골라요</span></div>
      <div class="mine-btns">
        <button class="btn" id="b-start" disabled title="고른 순서쌍대로 한 꼭짓점 둘레를 정다각형으로 채워요">한 꼭짓점 채우기</button>
        <span id="add-btns" class="add-btns"></span>   <!-- 11/12 고른 순서쌍에 들어 있는 정다각형만 ＋버튼(setCombo 에서 그림) -->
      </div>
      <div class="mine-r" id="mine-r"></div>
    </div>

    <!-- 11/12 도움말 문장은 뺌(조작법: 타일을 누르면 돌리는 손잡이, 꼭짓점끼리 가까이 대면 붙음) -->
  </aside>
  <main>
    <div class="nokey hidden" id="nokey">폴리패드를 불러오지 못했어요. 새로 고치거나 위의 [폴리패드 새 창]으로 열어 주세요.</div>
    <div id="pp"></div>
  </main>
</div>
<!-- 11/12 미션 탭 전환은 아래 모듈의 switchMission 에서(미션별 그림판 저장·불러오기) -->
<!-- 폴리패드 공식 JS API (Amplify). 이용 조건: 'Powered by Polypad' 표시를 가리지 않고, 파일을 우리 서버에 복사하지 않는다.
     API 키는 polypad.amplify.com/api 에서 사이트 주소로 받은 것으로 바꾼다(11/12 받은 키, 사이트 algeo-dongbu-1114.web.app). -->
<script src="tess-vertex.js"></script>
<script src="https://polypad.amplify.com/api/latest/polypad.js?lang=ko&apiKey=yY97VSCYBjMx69o3jCOQ"></script>
<script type="module">
  // 교실용: 연수 사이트 연결(작품 실시간 전송·제출)을 빼고, 미션별 그림판 저장 + PNG 내려받기만 남김.
  const bar = document.getElementById('sync-bar');
  let pad = null, lastHash = '', lastAt = 0, busy = false, sent = 0, note = '', dirty = true;
  // 11/12 반정규 활동: 내 조합(꼭짓점 배열, 예 '3.4.6.4') — 칩을 누르면 정해지고 작품과 함께 강사 화면으로 간다
  const COMBO_KEY = 'mik.tessCombo';
  let combo = (() => { try { return localStorage.getItem(COMBO_KEY) || ''; } catch { return ''; } })();
  const comboLabel = (c) => `(${c.split('.').join(', ')})`;
  const TRAPS = new Set(['3.3.6.6', '3.4.4.6', '5.5.10']);
  const mission = () => curM;   // 11/12 미션 탭 → curM(아래 switchMission)
  function paint(msg, kind) {
    const c = { ok: ['#e8f7ee', '#1c7a47', '#9fd9b5'], warn: ['#fff7d6', '#7a5a00', '#f0d77a'], err: ['#fde8e7', '#b4231b', '#f3b1ac'] }[kind || 'warn'];
    bar.style.background = c[0]; bar.style.color = c[1]; bar.style.borderBottomColor = c[2]; bar.textContent = msg;
  }
  function status() {
    if (note) return paint(note, 'err');
    if (!pad) return paint('폴리패드를 불러오는 중…', 'warn');
    paint('미션마다 그림판이 따로 있고 이 기기에 저장돼요 · 다 깔았으면 [그림으로 저장]을 눌러 선생님께 내요', 'ok');
  }
  const strHash = (s) => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return h + ':' + s.length; };
  // 타일 이름 → 한국어(정다각형), 나머지는 '다각형'·'기타'
  const KO = { 'equ-triangle': '정삼각형', square: '정사각형', 'reg-pentagon': '정오각형', 'reg-hexagon': '정육각형', 'reg-heptagon': '정칠각형', 'reg-octagon': '정팔각형', 'reg-nonagon': '정구각형', 'reg-decagon': '정십각형', 'reg-dodecagon': '정십이각형' };
  const ORDER = Object.values(KO);
  function tileSummary(d) {
    const cnt = {};
    for (const t of Object.values(d.tiles || {})) {
      const sh = String(t.shape || '');
      const k = t.name === 'polygon' ? (KO[sh] || (/^reg-\d+$/.test(sh) ? `정${sh.slice(4)}각형` : '다각형')) : '기타';
      cnt[k] = (cnt[k] || 0) + 1;
    }
    const rank = (k) => { const i = ORDER.indexOf(k); return i < 0 ? 99 : i; };
    return Object.entries(cnt).sort((a, b) => rank(a[0]) - rank(b[0])).map(([k, n]) => `${k} ${n}`).join(' · ').slice(0, 200);
  }
  function shrink(src, maxW = 480, q = 0.62) {
    return new Promise((res) => {
      if (!src) return res('');
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, maxW / im.width), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q));
      };
      im.onerror = () => res('');
      im.src = src;
    });
  }
  function capture() { /* 교실용: 실시간 전송 없음 */ }
  // ---- 내 조합 · 시작 꼭짓점 · 타일 비 ----
  const TV = window.TessVertex;
  function padCenter() {
    const el = document.getElementById('pp'), w = el.clientWidth, h = el.clientHeight;
    let vp = { x: 0, y: 0, zoom: 1 }; try { vp = { ...vp, ...(pad.getViewport() || {}) }; } catch { /* 기본값 */ }
    const z = vp.zoom || 1, sx = Math.min(w, 300 + (w - 300) / 2) || w / 2;   // 왼쪽 타일 막대(약 300px) 오른쪽 가운데
    return [vp.x + sx / z, vp.y + h / 2 / z];
  }
  function addTiles(list) {
    const ids = [];
    for (const t of list) { try { const id = pad.add(t); if (id) ids.push(id); } catch (e) { console.error(e); } }
    try { if (ids.length) pad.select(ids); } catch { /* 선택은 덤 */ }
    dirty = true; mineRatio();
  }
  function placeStart() {
    if (!pad || !combo) return;
    const [cx, cy] = padCenter(), off = Object.keys(pad.serialize().tiles || {}).length ? 60 : 0;   // 이미 타일이 있으면 조금 비켜 놓기
    addTiles(TV.vertexTiles(combo.split('.').map(Number), cx + off, cy + off));
  }
  function addOne(n) { if (!pad) return; const [cx, cy] = padCenter(), k = (addOne.k = ((addOne.k || 0) + 1) % 4); addTiles([{ name: 'polygon', shape: TV.SHAPE[n], x: cx - 230 + k * 25, y: cy + 150 + k * 25, rot: 0, color: TV.COLOR[n] }]); }   // 시작 꼭짓점과 겹치지 않게 왼쪽 아래에
  const SH2N = Object.fromEntries(Object.entries(TV.SHAPE).map(([n, s]) => [s, Number(n)]));
  function mineRatio() {
    const box = document.getElementById('mine-r'); if (!box) return;
    const cnt = {};
    if (pad) for (const t of Object.values(pad.serialize().tiles || {})) { const n = SH2N[t.shape]; if (n) cnt[n] = (cnt[n] || 0) + 1; }
    const have = Object.keys(cnt).map(Number).sort((p, q) => p - q).map((n) => `${TV.NAME[n]} ${cnt[n]}`).join(' · ') || '아직 없어요';
    let line = `내 타일: <b>${have}</b>`;
    if (combo && !TRAPS.has(combo)) {
      const r = TV.ratio(combo.split('.').map(Number));
      if (r.length > 1) {
        // 예측 비는 보여 주지 않는다(직접 예측). 지금 개수를 '가장 적은 쪽 = 1' 로 맞춘 비만 보여 준다
        const ref = r.reduce((m, x) => (x[1] < m[1] ? x : m));
        const now = r.every(([n]) => cnt[n]) ? r.map(([n]) => (cnt[n] / cnt[ref[0]] * ref[1]).toFixed(1).replace(/\.0$/, '')).join(' : ') : '';
        line += `<br>${now ? `지금 ${r.map(([n]) => TV.NAME[n]).join(' : ')} = <b>${now}</b> · 넓힐수록 예측한 비에 가까워지나요?` : '타일을 넓혀 가며 예측한 비와 견주어 보세요'}`;
      }
    }
    box.innerHTML = line;
  }
  function setCombo(c) {
    combo = c; try { localStorage.setItem(COMBO_KEY, c); } catch { /* 이번 화면만 */ }
    document.querySelectorAll('button.chip.pick').forEach((b) => b.classList.toggle('sel', b.dataset.c === c));
    document.getElementById('mine-c').textContent = c ? comboLabel(c) : '위 순서쌍을 눌러 골라요';
    document.getElementById('b-start').disabled = !c || !pad;
    drawAddBtns();
    dirty = true; mineRatio();
  }
  document.querySelectorAll('button.chip.pick').forEach((b) => b.addEventListener('click', () => setCombo(b.dataset.c)));
  document.getElementById('b-start').onclick = placeStart;
  // 11/12 사용자: ＋버튼은 고른 순서쌍의 정다각형만 — (6, 6, 6) → ＋정육각형, (4, 6, 12) → ＋정사각형·＋정육각형·＋정십이각형
  function drawAddBtns() {
    const box = document.getElementById('add-btns'); box.innerHTML = '';
    if (!combo) return;
    [...new Set(combo.split('.').map(Number))].sort((p, q) => p - q).forEach((n) => {
      if (!TV.SHAPE[n]) return;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn'; b.textContent = '＋' + TV.NAME[n]; b.title = TV.NAME[n] + ' 한 장 놓기';
      b.onclick = () => addOne(n); b.disabled = !pad;
      box.append(b);
    });
  }
  window.tessSetCombo = setCombo; window.tessPlaceStart = placeStart;
  const fail = (e) => { console.error(e); document.getElementById('nokey').classList.remove('hidden'); };
  try {
    Promise.resolve(Polypad.create(document.getElementById('pp'), {
      sidebarTiles: true, toolbar: true, actionbar: true, settings: true, initial: { options: { sidebar: 'polygons' } },
    })).then((p) => {
      pad = p; window.pad = p;
      if (window.top !== window.self) setTimeout(() => { try { p.toggleSidebar(false); } catch { /* 접기 실패해도 그대로 */ } }, 300);   // 11/12 연수 화면 안에서는 타일 메뉴를 접은 채로
      p.on('change', () => { dirty = true; mineRatio(); if (!loading) { saveDraft(); subUI(); } });
      if (localStorage.getItem(draftKey(curM))) loadDraft(curM);   // 새로 고쳐도 그리던 미션 그림이 남게
      setCombo(combo); status(); setTimeout(() => capture(true), 1500);
    }).catch(fail);
  } catch (e) { fail(e); }
  setTimeout(() => { if (!pad) document.getElementById('nokey').classList.remove('hidden'); }, 25000);
  // ---------- 11/12 미션별 그림판 + 미션별 제출 ----------
  // 미션을 바꾸면 지금 그림판을 이 기기에 저장(localStorage)하고 그 미션 그림판을 불러온다. 제출은 dgSessions/{회차}/tessSub/{uid}_m{N}.
  let curM = 1, loading = false;
  const submitted = {};   // 미션 번호 → 제출 시각(Date)
  const draftKey = (m) => `mik.pp.m${m}`;   // 이 기기에 미션별 그리던 그림(회차와 상관없이)
  function saveDraft(m = curM) { if (!pad || loading) return; try { localStorage.setItem(draftKey(m), JSON.stringify(pad.serialize())); } catch { /* 저장 못 해도 화면은 그대로 */ } }
  function loadDraft(m) {
    if (!pad) return;
    loading = true;
    try {
      pad.clear();
      const raw = localStorage.getItem(draftKey(m));
      if (raw) pad.unSerialize(JSON.parse(raw));
    } catch (e) { console.warn('미션 그림판 불러오기', e); }
    setTimeout(() => { loading = false; dirty = true; mineRatio(); subUI(); }, 300);
  }
  const comboKey = (m) => `mik.tessCombo.m${m}`;
  function switchMission(m) {
    if (m === curM) return;
    saveDraft(curM);
    try { localStorage.setItem(comboKey(curM), combo); } catch { /* 이번 화면만 */ }
    curM = m;
    let c = ''; try { c = localStorage.getItem(comboKey(m)) || ''; } catch { /* 없음 */ }
    if (c && !document.querySelector(`#m${m} button.chip.pick[data-c="${c}"]`)) c = '';
    setCombo(c);   // 미션마다 고른 순서쌍이 따로
    document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', Number(x.dataset.m) === m));
    document.querySelectorAll('.mission').forEach((x) => x.classList.toggle('on', x.id === 'm' + m));
    loadDraft(m);
    subUI();
    setTimeout(() => capture(true), 700);
  }
  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => switchMission(Number(b.dataset.m))));
  const hhmm = (d) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  function subUI(msg, kind) {
    const btn = document.getElementById('b-submit'), st = document.getElementById('sub-st');
    const n = pad ? Object.keys(pad.serialize().tiles || {}).length : 0;
    btn.textContent = `🖼 미션 ${curM} 그림으로 저장`;
    btn.disabled = !pad || !n;
    document.querySelectorAll('.tabs button').forEach((b) => {
      const m = Number(b.dataset.m); let ck = b.querySelector('.ck');
      if (submitted[m] && !ck) { ck = document.createElement('span'); ck.className = 'ck'; ck.textContent = '✓'; b.append(ck); }
      if (!submitted[m] && ck) ck.remove();
    });
    st.className = 'sub-st' + (kind ? ' ' + kind : submitted[curM] ? ' ok' : '');
    st.textContent = msg || (submitted[curM] ? `✓ ${hhmm(submitted[curM])}에 저장했어요 · 고쳐서 다시 저장할 수 있어요`
      : !n ? '타일을 놓은 뒤 저장해요' : '다 깔았으면 그림으로 저장해 선생님께 내요');
  }
  async function submitMission() {
    const btn = document.getElementById('b-submit');
    if (btn.disabled) return;
    btn.disabled = true; subUI('그림을 만드는 중…');
    try {
      const d = pad.serialize();
      const src = await Promise.resolve(Polypad.toImage(d, 'png', 1200, 800));
      if (!src) throw new Error('그림을 만들지 못했어요');
      const a = document.createElement('a');
      const c = combo ? '_' + combo.split('.').join('-') : '';
      a.href = src; a.download = `테셀레이션_미션${curM}${c}.png`; document.body.append(a); a.click(); a.remove();
      submitted[curM] = new Date(); saveDraft();
      window.__lastPng = src.length;
      subUI(`✓ 미션 ${curM} 그림을 내려받았어요(다운로드 폴더)`, 'ok');
    } catch (e) {
      subUI('저장하지 못했어요(' + (e.message || e) + ') · 다시 눌러 주세요', 'err');
    } finally { btn.disabled = false; setTimeout(() => subUI(), 4000); }
  }
  document.getElementById('b-submit').onclick = submitMission;
  setInterval(() => { if (!loading) { saveDraft(); subUI(); } }, 3000);
</script>

<style>.hidden{display:none}</style>
</body>
