<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>꼭짓점 마스터: 360도의 비밀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        #found-list::-webkit-scrollbar, #all-answers-list::-webkit-scrollbar {
            width: 8px;
        }
        #found-list::-webkit-scrollbar-track, #all-answers-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        #found-list::-webkit-scrollbar-thumb, #all-answers-list::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        #found-list::-webkit-scrollbar-thumb:hover, #all-answers-list::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .polygon-btn {
            transition: all 0.2s ease-in-out;
        }
        .polygon-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .message-popup {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            z-index: 1050; /* Higher than modal */
            opacity: 0;
            transition: opacity 0.5s ease-in-out, top 0.5s ease-in-out;
            font-size: 0.9rem;
        }
        .message-popup.show {
            opacity: 1;
            top: 40px;
        }
        .message-popup.success { background-color: #4CAF50; }
        .message-popup.error { background-color: #F44336; }
        .message-popup.info { background-color: #2196F3; }
        .message-popup.hint-msg { background-color: #FF9800; }

        /* Modal Styles */
        .modal {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 1000;
        }
        .modal.open {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-sky-100 to-indigo-200 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">
    <!-- 교실용: 찾은 조합은 이 기기(브라우저)에 저장된다 -->
    <div id="sync-bar" style="position:fixed;top:0;left:0;right:0;z-index:60;padding:8px 14px;font:600 14px/1.4 'Noto Sans KR',sans-serif;text-align:center;background:#e8f7ee;color:#1c7a47;border-bottom:1px solid #9fd9b5"><span id="sync-msg">찾은 조합은 이 기기에 저장돼요</span></div>
    <div style="height:44px"></div>


    <div id="app-container" class="bg-white/80 backdrop-blur-md shadow-2xl rounded-xl p-6 md:p-8 w-full max-w-4xl">
        <header class="text-center mb-6 md:mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-indigo-700">✨ 꼭짓점 마스터: 360도의 비밀 ✨</h1>
            <p class="text-gray-600 mt-2 text-sm md:text-base">정다각형을 선택하여 한 꼭짓점에서의 내각의 합이 360°가 되는 17가지 조합을 찾아보세요!</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Polygon Selector Panel -->
            <div id="polygon-selector-panel" class="md:col-span-1 bg-slate-50 p-4 rounded-lg shadow">
                <h2 class="text-xl font-semibold text-slate-700 mb-3 text-center">다각형 선택</h2>
                <div id="polygon-buttons-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-2 gap-2">
                    <!-- Polygon buttons will be inserted here by JavaScript -->
                </div>
            </div>

            <!-- Vertex Assembly Panel -->
            <div id="vertex-assembly-panel" class="md:col-span-1 bg-slate-50 p-4 rounded-lg shadow flex flex-col">
                <h2 class="text-xl font-semibold text-slate-700 mb-3 text-center">현재 꼭짓점 구성</h2>
                <div id="current-vertex-display" class="bg-white p-3 rounded min-h-[80px] border border-slate-300 text-sm text-slate-700 mb-3 flex-grow overflow-y-auto">
                    <!-- Selected polygons will be shown here -->
                </div>
                <div id="current-sum-display" class="text-lg font-semibold text-indigo-600 mb-3 text-center">현재 각도 합계: 0°</div>
                <button id="clear-vertex-button" class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg shadow transition-colors duration-150">
                    꼭짓점 비우기
                </button>
            </div>

            <!-- Found Combinations Panel -->
            <div id="found-combinations-panel" class="md:col-span-1 bg-slate-50 p-4 rounded-lg shadow flex flex-col">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-xl font-semibold text-slate-700 text-center">
                        찾은 조합 <span id="progress-counter">(0/17)</span>
                    </h2>
                </div>
                <ul id="found-list" class="list-disc pl-5 pr-2 bg-white rounded border border-slate-300 text-sm text-slate-700 space-y-1 overflow-y-auto h-48 md:h-auto flex-grow">
                    <!-- Found combinations will be listed here -->
                </ul>
                <div class="mt-4 space-y-2">
                    <button id="hint-button" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-semibold py-2 px-4 rounded-lg shadow transition-colors duration-150">
                        힌트 보기 <span id="hints-remaining-display">(5회 남음)</span>
                    </button>
                    <button id="show-all-answers-button" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-semibold py-2 px-4 rounded-lg shadow transition-colors duration-150">
                        모든 정답 보기
                    </button>
                </div>
            </div>
        </div>
         <p class="text-xs text-gray-500 mt-6 text-center">최소 3개, 최대 6개의 다각형으로 조합을 만드세요. 현재 꼭짓점의 다각형을 클릭하여 제거할 수 있습니다.</p>
    </div>

    <!-- All Answers Modal -->
    <div id="all-answers-modal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-semibold text-indigo-700">17가지 모든 조합</h3>
                <button id="close-modal-button" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
            </div>
            <ul id="all-answers-list" class="list-decimal pl-5 space-y-1 text-sm text-slate-600 max-h-[60vh] overflow-y-auto">
                <!-- All 17 combinations will be listed here -->
            </ul>
        </div>
    </div>

    <div id="message-popup-container"></div>

    <script>
        const polygonsData = [
            { sides: 3, name: '정삼각형', angle: 60 },
            { sides: 4, name: '정사각형', angle: 90 },
            { sides: 5, name: '정오각형', angle: 108 },
            { sides: 6, name: '정육각형', angle: 120 },
            { sides: 7, name: '정칠각형', angle: (5 * 180) / 7 },
            { sides: 8, name: '정팔각형', angle: 135 },
            { sides: 9, name: '정구각형', angle: 140 },
            { sides: 10, name: '정십각형', angle: 144 },
            { sides: 12, name: '정십이각형', angle: 150 },
            { sides: 15, name: '정십오각형', angle: 156 },
            { sides: 18, name: '정십팔각형', angle: 160 },
            { sides: 20, name: '정이십각형', angle: 162 },
            { sides: 24, name: '정이십사각형', angle: 165 },
            { sides: 42, name: '정사십이각형', angle: (40 * 180) / 42 },
        ];

        const targetCombinationsRaw = [
            [3,3,3,3,3,3], [3,3,3,4,4], [3,3,3,3,6], [4,4,4,4],
            [3,4,4,6], [3,3,6,6], [3,3,4,12], [6,6,6],
            [5,5,10], [4,8,8], [4,6,12], [4,5,20],
            [3,12,12], [3,10,15], [3,9,18], [3,8,24], [3,7,42]
        ];

        const targetCombinationsStrings = new Set(
            targetCombinationsRaw.map(arr => arr.sort((a,b) => a-b).join(','))
        );

        let currentVertexPolygons = [];
        let foundCombinationsSet = new Set();
        const EPSILON = 0.001;

        // Simplified Hint State for Method 1
        let hintState = {
            hintsRemaining: 5,
        };

        const polygonButtonsContainer = document.getElementById('polygon-buttons-container');
        const currentVertexDisplay = document.getElementById('current-vertex-display');
        const currentSumDisplay = document.getElementById('current-sum-display');
        const clearVertexButton = document.getElementById('clear-vertex-button');
        const foundList = document.getElementById('found-list');
        const progressCounter = document.getElementById('progress-counter');
        const messagePopupContainer = document.getElementById('message-popup-container');

        const hintButton = document.getElementById('hint-button');
        const hintsRemainingDisplay = document.getElementById('hints-remaining-display');
        const showAllAnswersButton = document.getElementById('show-all-answers-button');
        const allAnswersModal = document.getElementById('all-answers-modal');
        const closeModalButton = document.getElementById('close-modal-button');
        const allAnswersList = document.getElementById('all-answers-list');


        function getPolygonNameBySides(sides) {
            const polygon = polygonsData.find(p => p.sides === sides);
            return polygon ? polygon.name : `${sides}각형`;
        }

        function initPolygonSelectors() {
            polygonsData.forEach(polygon => {
                const button = document.createElement('button');
                button.classList.add('polygon-btn', 'bg-indigo-500', 'hover:bg-indigo-600', 'text-white', 'text-xs', 'font-medium', 'py-2', 'px-1', 'rounded-md', 'shadow');
                const angleDisplay = Number.isInteger(polygon.angle) ? polygon.angle : polygon.angle.toFixed(2);
                button.innerHTML = `${polygon.name}<br>(${angleDisplay}°)`;
                button.dataset.sides = polygon.sides;
                button.addEventListener('click', () => addPolygonToVertex(polygon.sides));
                polygonButtonsContainer.appendChild(button);
            });
        }

        function addPolygonToVertex(sides) {
            if (currentVertexPolygons.length >= 6) {
                showMessage('최대 6개의 다각형만 추가할 수 있습니다.', 'info');
                return;
            }
            const polygon = polygonsData.find(p => p.sides === sides);
            if (polygon) {
                currentVertexPolygons.push(polygon);
                updateVertexDisplayAndSum();
                checkCombination();
            }
        }
        
        function removePolygonFromVertex(index) {
            if (index >= 0 && index < currentVertexPolygons.length) {
                currentVertexPolygons.splice(index, 1); 
                updateVertexDisplayAndSum(); 
                checkCombination(); 
            }
        }

        function updateVertexDisplayAndSum() {
            currentVertexDisplay.innerHTML = ''; 
            currentVertexPolygons.forEach((p, index) => {
                const polygonSpan = document.createElement('span');
                polygonSpan.classList.add(
                    'inline-block', 'bg-indigo-100', 'text-indigo-700', 
                    'px-2', 'py-1', 'rounded-md', 'mr-1', 'mb-1', 
                    'cursor-pointer', 'hover:bg-red-200', 'hover:text-red-700', 'transition-colors', 'duration-150'
                );
                polygonSpan.textContent = p.name;
                polygonSpan.dataset.index = index; 
                polygonSpan.title = `클릭하여 "${p.name}" 제거`; 

                polygonSpan.addEventListener('click', (event) => {
                    const indexToRemove = parseInt(event.currentTarget.dataset.index); 
                    removePolygonFromVertex(indexToRemove);
                });
                currentVertexDisplay.appendChild(polygonSpan);
            });
            
            const currentSum = currentVertexPolygons.reduce((sum, p) => sum + p.angle, 0);
            currentSumDisplay.textContent = `현재 각도 합계: ${currentSum.toFixed(2)}°`;
        }

        function clearVertex() {
            currentVertexPolygons = [];
            updateVertexDisplayAndSum();
            currentSumDisplay.textContent = `현재 각도 합계: 0°`;
        }

        function checkCombination() {
            const numPolygons = currentVertexPolygons.length;
            if (numPolygons === 0) return; 
            
            const currentCombinationArraySorted = currentVertexPolygons.map(p => p.sides).sort((a, b) => a - b);
            const combinationString = currentCombinationArraySorted.join(',');

            if (numPolygons < 3) return; 

            const currentSum = currentVertexPolygons.reduce((sum, p) => sum + p.angle, 0);

            if (Math.abs(currentSum - 360) < EPSILON) {
                if (numPolygons > 6) {
                    showMessage('조합은 최대 6개의 다각형으로 이루어져야 합니다.', 'error');
                    return;
                }
                if (targetCombinationsStrings.has(combinationString)) {
                    if (!foundCombinationsSet.has(combinationString)) {
                        foundCombinationsSet.add(combinationString);
                        updateFoundListUI(currentCombinationArraySorted);
                        updateProgressUI();
                        window.tessSync && window.tessSync();
                        showMessage('🎉 정답! 새로운 조합을 찾았습니다!', 'success');
                        if (foundCombinationsSet.size === targetCombinationsStrings.size) {
                            showMessage('🎉 모든 17가지 조합을 찾았습니다! 대단해요!', 'success', 5000);
                            hintButton.disabled = true; 
                        }
                    } else {
                        showMessage('이미 찾은 조합입니다. 다른 조합을 시도해보세요!', 'info');
                    }
                } else {
                     showMessage('합은 360°이지만, 목표 조합 목록에 없습니다. (3~6개 다각형 규칙 확인)', 'info');
                }
            } else if (currentSum > 360 + EPSILON) {
                showMessage('각도 합계가 360°를 초과했습니다!', 'error');
            }
        }

        function updateFoundListUI(combinationArray) {
            const listItem = document.createElement('li');
            listItem.classList.add('text-indigo-700', 'py-0.5');
            listItem.textContent = `(${combinationArray.join(', ')})`;
            foundList.appendChild(listItem);
        }

        function updateProgressUI() {
            progressCounter.textContent = `(${foundCombinationsSet.size}/${targetCombinationsStrings.size})`;
        }
        
        let messageTimeout;
        function showMessage(text, type = 'info', duration = 3000) {
            if (messageTimeout) clearTimeout(messageTimeout);
            
            const existingPopup = messagePopupContainer.querySelector('.message-popup');
            if (existingPopup) existingPopup.remove();

            const popup = document.createElement('div');
            popup.className = `message-popup ${type}`; 
            popup.textContent = text;
            messagePopupContainer.appendChild(popup);

            void popup.offsetWidth; 
            popup.classList.add('show');

            messageTimeout = setTimeout(() => {
                popup.classList.remove('show');
                setTimeout(() => { if (popup.parentNode) popup.remove(); }, 500); 
            }, duration);
        }

        // MODIFIED Hint Logic for Method 1
        function giveHint() {
            if (hintState.hintsRemaining <= 0) {
                showMessage("힌트를 모두 사용했습니다!", "info");
                return;
            }
            if (foundCombinationsSet.size === targetCombinationsStrings.size) {
                showMessage("모든 조합을 이미 찾았습니다! 힌트가 필요 없어요.", "info");
                return;
            }

            hintState.hintsRemaining--;
            updateHintsRemainingDisplay();
            window.tessSync && window.tessSync();

            let unfoundCombinations = targetCombinationsRaw.filter(comboArr => {
                const comboStr = [...comboArr].sort((a,b) => a-b).join(',');
                return !foundCombinationsSet.has(comboStr);
            });

            if (unfoundCombinations.length === 0) {
                showMessage("더 이상 찾을 조합이 없습니다!", "info"); // Should be caught by the check above
                return;
            }

            const randomIndex = Math.floor(Math.random() * unfoundCombinations.length);
            const hintComboArray = unfoundCombinations[randomIndex]; // This is an array of side numbers
            
            let hintMessage = "";
            const hintType = Math.random() < 0.5 ? 'count' : 'specific_polygon'; // Randomly choose hint type

            if (hintType === 'count') {
                const polygonCount = hintComboArray.length;
                hintMessage = `힌트: ${polygonCount}개의 다각형으로 이루어진 조합이 아직 남아있어요.`;
            } else { // specific_polygon
                const randomPolygonIndexInHint = Math.floor(Math.random() * hintComboArray.length);
                const examplePolygonSides = hintComboArray[randomPolygonIndexInHint];
                const examplePolygonName = getPolygonNameBySides(examplePolygonSides);
                hintMessage = `힌트: ${examplePolygonName}을(를) 포함하는 조합을 찾아보세요!`;
            }
            
            showMessage(hintMessage, 'hint-msg', 4000); // Show hint for a bit longer
        }

        function updateHintsRemainingDisplay() {
            hintsRemainingDisplay.textContent = `(${hintState.hintsRemaining}회 남음)`;
            if (hintState.hintsRemaining <= 0) {
                hintButton.disabled = true;
                hintsRemainingDisplay.textContent = `(모두 사용)`;
            }
        }
        
        // All Answers Modal Logic (remains the same)
        function populateAllAnswersModal() {
            allAnswersList.innerHTML = ''; 
            targetCombinationsRaw.forEach(comboArray => {
                const sortedCombo = [...comboArray].sort((a,b) => a-b);
                const comboString = sortedCombo.join(',');
                const listItem = document.createElement('li');
                listItem.textContent = `(${sortedCombo.join(', ')})`;
                if (foundCombinationsSet.has(comboString)) {
                    listItem.classList.add('text-green-600', 'font-semibold', 'line-through');
                    listItem.title = "이미 찾음!";
                } else {
                    listItem.classList.add('text-slate-700');
                }
                allAnswersList.appendChild(listItem);
            });
        }

        function openModal() {
            window.tessPeek && window.tessPeek();
            populateAllAnswersModal();
            allAnswersModal.classList.add('open');
        }

        function closeModal() {
            allAnswersModal.classList.remove('open');
        }



        // ---- 저장 창구(아래 스크립트가 이 기기 localStorage 에 저장) ----
        window.tessGet = () => ({ found: [...foundCombinationsSet], hints: 5 - hintState.hintsRemaining });
        window.tessRestore = (found, hintsUsed) => {
            for (const str of found || []) {
                if (!targetCombinationsStrings.has(str) || foundCombinationsSet.has(str)) continue;
                foundCombinationsSet.add(str);
                updateFoundListUI(str.split(',').map(Number));
            }
            updateProgressUI();
            const used = Math.max(0, Math.min(5, hintsUsed || 0));
            if (5 - used < hintState.hintsRemaining) { hintState.hintsRemaining = 5 - used; updateHintsRemainingDisplay(); }
            if (foundCombinationsSet.size === targetCombinationsStrings.size) hintButton.disabled = true;
        };

        // Event Listeners
        clearVertexButton.addEventListener('click', clearVertex);
        hintButton.addEventListener('click', giveHint);
        showAllAnswersButton.addEventListener('click', openModal);
        closeModalButton.addEventListener('click', closeModal);
        allAnswersModal.addEventListener('click', (event) => { 
            if (event.target === allAnswersModal) {
                closeModal();
            }
        });


        // Initial setup
        window.addEventListener('DOMContentLoaded', () => {
            initPolygonSelectors();
            updateVertexDisplayAndSum(); 
            updateProgressUI();
            updateHintsRemainingDisplay();
        });
    </script>

    <script>
    // 교실용: 찾은 조합·쓴 힌트 수를 이 기기(localStorage)에 저장 — 새로 고쳐도 이어서 할 수 있다.
    (function () {
      const KEY = 'mik.vertexMaster';
      const msg = () => document.getElementById('sync-msg');
      const show = () => { const n = window.tessGet().found.length; msg().textContent = `찾은 조합 ${n}/17 · 이 기기에 저장돼요`; };
      function save() { try { localStorage.setItem(KEY, JSON.stringify(window.tessGet())); } catch (e) { /* 저장 못 해도 화면은 그대로 */ } show(); }
      window.tessSync = () => setTimeout(save, 50);
      window.tessPeek = () => setTimeout(save, 50);
      window.addEventListener('DOMContentLoaded', () => {
        try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d) window.tessRestore(d.found, d.hints); } catch (e) { /* 처음 */ }
        show();
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = '처음부터 다시';
        b.style.cssText = 'margin-left:10px;padding:1px 10px;border:1px solid #9fd9b5;border-radius:6px;background:#fff;color:#1c7a47;cursor:pointer;font:inherit';
        b.onclick = () => {
          if (b.dataset.k) { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); return; }
          b.dataset.k = 1; b.textContent = '한 번 더 누르면 지워져요';
          setTimeout(() => { delete b.dataset.k; b.textContent = '처음부터 다시'; }, 3000);
        };
        document.getElementById('sync-bar').append(b);
      });
    })();
    </script>
</body>
</html>
