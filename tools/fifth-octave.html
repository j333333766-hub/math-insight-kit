<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>피타고라스 음률 시각화 (완전5도 & 완전8도)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-color: #333;
            --white-key: #ffffff;
            --black-key: #2c3e50;
            --key-border: #bdc3c7;
            
            /* Highlight Colors */
            --color-selected: #f1c40f;      /* 노란색 (선택됨) */
            --color-p5-up: #3498db;         /* 파란색 (완전5도 위) */
            --color-p5-down: #2980b9;       /* 짙은 파란색 (완전5도 아래) */
            --color-p8-up: #e74c3c;         /* 빨간색 (완전8도 위) */
            --color-p8-down: #c0392b;       /* 짙은 빨간색 (완전8도 아래) */
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
        }

        .description {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1em;
            color: #555;
            line-height: 1.6;
        }

        .legend {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            font-size: 0.95em;
        }

        .color-box {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        /* Keyboard Container */
        .keyboard-wrapper {
            width: 100%;
            max-width: 1150px;
            overflow-x: auto;
            padding-bottom: 20px;
        }

        .piano {
            position: relative;
            height: 300px;
            margin: 0 auto;
            border: 4px solid #333;
            border-radius: 8px;
            background-color: #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* Key Styles */
        .key {
            position: absolute;
            top: 0;
            box-sizing: border-box;
            cursor: pointer;
            display: flex;
            justify-content: center;
            transition: background-color 0.2s;
            user-select: none;
        }

        .key.white {
            width: 60px; /* 건반이 줄어들었으므로 너비를 조금 넓혀 시원하게 표시 */
            height: 100%;
            background-color: var(--white-key);
            border-right: 1px solid var(--key-border);
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            z-index: 1;
            align-items: flex-end;
            padding-bottom: 15px;
        }
        
        .key.white:first-child { border-left: 1px solid var(--key-border); border-bottom-left-radius: 6px; }
        .key.white:last-child { border-right: none; border-bottom-right-radius: 6px; }

        .key.black {
            width: 36px;
            height: 60%;
            background-color: var(--black-key);
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            z-index: 2;
            align-items: flex-end;
            padding-bottom: 15px;
            color: white;
        }

        .key:active {
            filter: brightness(0.9);
        }

        /* Labels */
        .note-label {
            font-size: 0.95em;
            font-weight: 500;
            pointer-events: none;
        }

        .black .note-label {
            font-size: 0.8em;
            color: rgba(255,255,255,0.8);
        }
        /* 11/13 사용자: 옥타브 숫자 대신 연주용 키보드 키 표시 */
        .note-label { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .kbd { display: inline-block; min-width: 22px; padding: 1px 5px; border: 1.5px solid #9aa3b2; border-bottom-width: 3px; border-radius: 5px; background: #f4f6f9; color: #2c3e50; font: 700 13px/1.3 Consolas, 'Courier New', monospace; text-align: center; }
        .black .kbd { min-width: 18px; padding: 1px 3px; background: #46586b; color: #fff; border-color: #8193a6; font-size: 12px; }
        .kbds { display: flex; gap: 3px; }
        .white .kbds .kbd { min-width: 18px; padding: 1px 4px; }
        .kbd.num { background: #fff4c2; border-color: #d9b44a; color: #7a5a00; }
        .key.down { filter: brightness(0.82); transform: translateY(2px); }
        /* 칠한 흰건반이 검은건반을 덮지 않게, 배지는 음 이름·키 표시 위로 */
        .key.white.selected, .key.white.p5-up, .key.white.p5-down, .key.white.p8-up, .key.white.p8-down { z-index: 2 !important; }
        .key.black { z-index: 3 !important; }
        .key.white .interval-badge { bottom: 78px !important; }
        .key.black .interval-badge { bottom: 72px !important; }
        .kbd-tip { font-size: 0.9em; color: #6b7385; margin-top: 6px; }

        /* Highlight Classes */
        .key.selected { background-color: var(--color-selected) !important; color: #333; border: 2px solid #e67e22; z-index: 3;}
        .key.p5-up { background-color: var(--color-p5-up) !important; color: white; z-index: 3;}
        .key.p5-down { background-color: var(--color-p5-down) !important; color: white; z-index: 3;}
        .key.p8-up { background-color: var(--color-p8-up) !important; color: white; z-index: 3;}
        .key.p8-down { background-color: var(--color-p8-down) !important; color: white; z-index: 3;}

        /* Interval Badge */
        .interval-badge {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            color: white;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .key.white .interval-badge { top: auto; bottom: 45px; } 
        .key.black .interval-badge { top: auto; bottom: 40px; } 

        .key.selected .interval-badge { background-color: #e67e22; opacity: 1; }
        .key.p5-up .interval-badge { background-color: var(--color-p5-up); opacity: 1; }
        .key.p5-down .interval-badge { background-color: var(--color-p5-down); opacity: 1; }
        .key.p8-up .interval-badge { background-color: var(--color-p8-up); opacity: 1; }
        .key.p8-down .interval-badge { background-color: var(--color-p8-down); opacity: 1; }

    </style>
</head>
<body>

    <h1>피타고라스 음률 시각화 웹앱</h1>
    <p class="description">
        아무 건반이나 클릭하거나 <b>키보드</b>로 연주해 보세요(건반 위 글자 = 누를 키). <br>
        선택한 건반을 기준으로 <b>완전5도(7반음)</b>와 <b>완전8도(12반음)</b> 간격의 건반이 표시됩니다.
    </p>

    <div class="legend">
        <div class="legend-item"><div class="color-box" style="background: var(--color-selected);"></div> 기준음</div>
        <div class="legend-item"><div class="color-box" style="background: var(--color-p5-up);"></div> 완전5도 위</div>
        <div class="legend-item"><div class="color-box" style="background: var(--color-p5-down);"></div> 완전5도 아래</div>
        <div class="legend-item"><div class="color-box" style="background: var(--color-p8-up);"></div> 완전8도 위</div>
        <div class="legend-item"><div class="color-box" style="background: var(--color-p8-down);"></div> 완전8도 아래</div>
    </div>

    <div class="keyboard-wrapper">
        <div class="piano" id="piano"></div>
    </div>
    <p class="kbd-tip" id="kbd-tip">흰건반 <span class="kbd num">1</span>~<span class="kbd num">0</span> 또는 <span class="kbd">A</span>~<span class="kbd">;</span> · 검은건반 <span class="kbd">W</span> <span class="kbd">E</span> <span class="kbd">T</span> <span class="kbd">Y</span> <span class="kbd">U</span> <span class="kbd">O</span> <span class="kbd">P</span> · 한글 입력 상태여도 돼요 · 키가 안 먹으면 건반을 한 번 클릭하세요</p>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const piano = document.getElementById('piano');
            
            // 범위 한정: C4 (MIDI 60, 도4) ~ E5 (MIDI 76, 미5)
            const startMidi = 60; 
            const endMidi = 76;
            
            const notes = ['도', '도#', '레', '레#', '미', '파', '파#', '솔', '솔#', '라', '라#', '시'];
            
            // 11/13 키보드 연주: 흰건반 A S D F G H J K L ; · 검은건반 W E T Y U O P (e.code 라 한글 입력 상태여도 같음)
            const KEY_OF = {
                60: { code: 'KeyA', label: 'A' }, 61: { code: 'KeyW', label: 'W' }, 62: { code: 'KeyS', label: 'S' }, 63: { code: 'KeyE', label: 'E' },
                64: { code: 'KeyD', label: 'D' }, 65: { code: 'KeyF', label: 'F' }, 66: { code: 'KeyT', label: 'T' }, 67: { code: 'KeyG', label: 'G' },
                68: { code: 'KeyY', label: 'Y' }, 69: { code: 'KeyH', label: 'H' }, 70: { code: 'KeyU', label: 'U' }, 71: { code: 'KeyJ', label: 'J' },
                72: { code: 'KeyK', label: 'K' }, 73: { code: 'KeyO', label: 'O' }, 74: { code: 'KeyL', label: 'L' }, 75: { code: 'KeyP', label: 'P' },
                76: { code: 'Semicolon', label: ';' },
            };
            const MIDI_OF = Object.fromEntries(Object.entries(KEY_OF).map(([m, k]) => [k.code, Number(m)]));
            // 11/13 사용자: 흰건반은 숫자키 1~0 으로도(도4=1 … 미5=0). 오른쪽 숫자 패드도 같게
            const WHITE = [60, 62, 64, 65, 67, 69, 71, 72, 74, 76], NUM_OF = {};
            WHITE.forEach((m, i) => { const d = String((i + 1) % 10); NUM_OF[m] = d; MIDI_OF['Digit' + d] = m; MIDI_OF['Numpad' + d] = m; });
            let ac = null;
            function playNote(midi) {
                try {
                    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
                    if (ac.state === 'suspended') ac.resume();
                    const f = 440 * Math.pow(2, (midi - 69) / 12), t = ac.currentTime;
                    const g = ac.createGain(); g.connect(ac.destination);
                    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
                    [[1, 'triangle', 1], [2, 'sine', 0.25]].forEach(([mul, type, v]) => {
                        const o = ac.createOscillator(), og = ac.createGain();
                        o.type = type; o.frequency.value = f * mul; og.gain.value = v;
                        o.connect(og); og.connect(g); o.start(t); o.stop(t + 1.5);
                    });
                } catch (e) { console.warn('소리', e); }
            }
            function press(midi) {
                playNote(midi); highlightIntervals(midi);
                const k = document.querySelector(`.key[data-midi="${midi}"]`);
                if (k) { k.classList.add('down'); clearTimeout(k._t); k._t = setTimeout(() => k.classList.remove('down'), 160); }
            }
            document.addEventListener('keydown', (e) => {
                if (e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
                const m = MIDI_OF[e.code];
                if (m === undefined) return;
                e.preventDefault(); press(m);
            });

            const whiteKeyWidth = 60; // 건반 개수가 줄어서 넓이를 약간 키움
            const blackKeyWidth = 36;
            let whiteKeyCount = 0;

            // 1단계: 건반 생성 및 배치
            for (let midi = startMidi; midi <= endMidi; midi++) {
                const noteIndex = midi % 12;
                const octave = Math.floor(midi / 12) - 1; // MIDI 60 = C4
                const noteName = notes[noteIndex];
                const isBlack = noteName.includes('#');

                const key = document.createElement('div');
                key.classList.add('key');
                key.classList.add(isBlack ? 'black' : 'white');
                key.dataset.midi = midi;

                // 라벨 추가 (도4, 레4 등)
                const label = document.createElement('div');
                label.className = 'note-label';
                // 11/13 사용자: 옥타브 숫자 대신 이 음을 연주하는 키보드 키
                const nm = document.createElement('span'); nm.textContent = noteName;
                const kb = document.createElement('span'); kb.className = 'kbd'; kb.textContent = KEY_OF[midi] ? KEY_OF[midi].label : '';
                const ks = document.createElement('span'); ks.className = 'kbds';
                if (NUM_OF[midi]) { const kn = document.createElement('span'); kn.className = 'kbd num'; kn.textContent = NUM_OF[midi]; ks.append(kn); }
                ks.append(kb);
                label.append(nm, ks);
                key.appendChild(label);

                // 인터벌 뱃지 엘리먼트
                const badge = document.createElement('div');
                badge.className = 'interval-badge';
                key.appendChild(badge);

                // 위치 계산 (절대 위치 지정)
                if (!isBlack) {
                    key.style.left = `${whiteKeyCount * whiteKeyWidth}px`;
                    whiteKeyCount++;
                } else {
                    key.style.left = `${(whiteKeyCount * whiteKeyWidth) - (blackKeyWidth / 2)}px`;
                }

                // 클릭 이벤트 등록
                key.addEventListener('click', () => { press(midi); window.focus(); });

                piano.appendChild(key);
            }

            // 피아노 컨테이너 전체 너비 설정
            piano.style.width = `${whiteKeyCount * whiteKeyWidth}px`;


            // 2단계: 인터랙션 로직
            function highlightIntervals(selectedMidi) {
                // 1. 기존 강조 효과 모두 초기화
                document.querySelectorAll('.key').forEach(key => {
                    key.classList.remove('selected', 'p5-up', 'p5-down', 'p8-up', 'p8-down');
                    const badge = key.querySelector('.interval-badge');
                    if(badge) badge.textContent = '';
                });

                // 2. 기준음 강조
                const baseKey = document.querySelector(`.key[data-midi="${selectedMidi}"]`);
                if (baseKey) {
                    baseKey.classList.add('selected');
                    baseKey.querySelector('.interval-badge').textContent = '기준';
                }

                // 3. 관계음 강조 (함수 활용)
                applyHighlight(selectedMidi + 7, 'p5-up', '완전5도 위');
                applyHighlight(selectedMidi - 7, 'p5-down', '완전5도 아래');
                applyHighlight(selectedMidi + 12, 'p8-up', '완전8도 위');
                applyHighlight(selectedMidi - 12, 'p8-down', '완전8도 아래');
            }

            function applyHighlight(targetMidi, className, badgeText) {
                const targetKey = document.querySelector(`.key[data-midi="${targetMidi}"]`);
                // 건반 범위를 벗어난 음은 표시하지 않음
                if (targetKey) {
                    targetKey.classList.add(className);
                    const badge = targetKey.querySelector('.interval-badge');
                    if (badge) badge.textContent = badgeText;
                }
            }
        });
    </script>
</body>
</html>
